$kind: http-request
url: "{{base_url}}/api/catalogo/actuados?estado_origen_id={{estado_en_ejecucion_id}}"
method: GET
queryParams:
  estado_origen_id: "{{estado_en_ejecucion_id}}"
scripts:
  - type: afterResponse
    code: pm.test('200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000

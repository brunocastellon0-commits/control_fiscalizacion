$kind: http-request
url: "{{base_url}}/api/catalogo/actuados"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data || [];
      const by = (c) => d.find(a => a.codigo === c);
      if (by('ACT_INFORME_FINAL')) pm.collectionVariables.set('catalogo_informe_final_id', by('ACT_INFORME_FINAL').id);
      if (by('ACT_DERIVACION_INCOMPETENCIA')) pm.collectionVariables.set('catalogo_derivacion_id', by('ACT_DERIVACION_INCOMPETENCIA').id);
    language: text/javascript
order: 3000

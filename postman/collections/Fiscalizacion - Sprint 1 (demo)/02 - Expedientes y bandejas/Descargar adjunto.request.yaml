$kind: http-request
description: Ejecutar antes 'Detalle expediente 16' para capturar adjunto_id.
url: "{{base_url}}/api/adjuntos/{{adjunto_id}}/descargar"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('PDF', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('pdf'));
    language: text/javascript
order: 8000

$kind: http-request
url: "{{base_url}}/api/admin/usuarios/{{usuario_id}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "ci": "{{nuevo_ci}}",
      "nombres": "Usuario",
      "apellidos": "Demo Editado",
      "cargo": "Tecnico de prueba",
      "username": "{{nuevo_username}}",
      "password": null,
      "rol_id": {{rol_tecnico_id}}
    }
scripts:
  - type: afterResponse
    code: pm.test('200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000

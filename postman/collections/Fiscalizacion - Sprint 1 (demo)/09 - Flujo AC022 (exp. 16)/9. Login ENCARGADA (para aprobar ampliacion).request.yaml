$kind: http-request
url: "{{base_url}}/api/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{encargada_user}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Login ENCARGADA 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 10000

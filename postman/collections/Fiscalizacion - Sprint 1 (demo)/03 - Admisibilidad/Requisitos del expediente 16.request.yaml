$kind: http-request
url: "{{base_url}}/api/expedientes/{{expediente_id}}/requisitos"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data || [];
      const payload = { requisitos: d.map(r => ({ requisito_id: r.id, cumple: true })) };
      pm.collectionVariables.set('requisitos_payload', JSON.stringify(payload));
      pm.test('Requisitos cargados', () => pm.expect(d.length).to.be.greaterThan(0));
    language: text/javascript
order: 1000

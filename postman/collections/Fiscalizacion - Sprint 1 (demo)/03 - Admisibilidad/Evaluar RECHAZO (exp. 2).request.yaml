$kind: http-request
description: "Requiere login TECNICO 03 (asignado al expediente 2). Falla un requisito CRITICO (id 1): genera RECHAZADO."
url: "{{base_url}}/api/expedientes/2/evaluacion"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "requisitos": [
        { "requisito_id": 1, "cumple": false },
        { "requisito_id": 2, "cumple": true },
        { "requisito_id": 3, "cumple": true }
      ]
    }
scripts:
  - type: afterResponse
    code: pm.test('201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 5000

$kind: http-request
description: Requiere login AUD. JURIDICO (asignado al expediente 8). Multipart con demo.pdf. El catalogo ACT_INFORME_FINAL no transiciona estado por si solo.
url: "{{base_url}}/api/expedientes/{{expediente_juridico_id}}/actuados"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: catalogo_actuado_id
      value: "{{catalogo_informe_final_id}}"
    - type: text
      key: descripcion
      value: Informe final de la investigacion con las conclusiones y recomendaciones del caso.
    - type: file
      key: adjunto
      src:
        - demo.pdf
scripts:
  - type: afterResponse
    code: pm.test('201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 1000

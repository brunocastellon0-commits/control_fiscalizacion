$kind: http-request
url: "{{base_url}}/api/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Sesion activa 200', () => pm.response.to.have.status(200));
      const d = pm.response.json();
      pm.collectionVariables.set('usuario_id', d.id || '');
      pm.collectionVariables.set('usuario_rol', d.rol ? d.rol.codigo : '');
    language: text/javascript
order: 9000
